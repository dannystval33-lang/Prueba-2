<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Login</title>
    <link rel="stylesheet" href="/client/assets/css/login.css">
</head>

<body>
    <div class="login-container">
        <form id="loginForm" class="login-form" novalidate>
            <div class="logo-container">
                <img src="/client/assets/img/logo.png" alt="SECURENET Logo">
            </div>
            <h2>Iniciar sesión</h2>
            <p class="subtitle">Bienvenido a SECURENET por favor ingresa tus datos</p>

            <div class="form-group">
                <label for="email">Correo electrónico / Cédula</label>
                <input type="email" id="email" name="email" placeholder="admin@mail.com">
                <div id="emailError" class="error-message"></div>
            </div>

            <div class="form-group"> 
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="**********">
                <div id="passwordError" class="error-message"></div>
</div>
            
            <button type="submit" id="submitBtn">Ingresar</button>
            <div id="globalMessage" class="global-Message"></div>
        </form>
        <script src="/client/assets/js/login.js"></script>
</body>
</html>
